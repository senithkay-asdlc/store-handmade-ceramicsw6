openapi: 3.0.3
info:
  title: Ceramics API
  version: 0.1.0
  description: Catalog, cart, checkout, and order management for the handmade ceramics store.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /products:
    get:
      operationId: listProducts
      summary: List/search/filter available products
      security: []
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: search text over title/description
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Matching products
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
    post:
      operationId: createProduct
      summary: Create a new product listing (Store Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      operationId: getProduct
      summary: Get a product's detail
      security: []
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateProduct
      summary: Edit a product listing (Store Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteProduct
      summary: Remove a product listing (Store Admin)
      responses:
        '204': { description: Product removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /carts/{cartId}:
    parameters:
      - $ref: '#/components/parameters/CartId'
    get:
      operationId: getCart
      summary: Get a cart with its items and totals
      security: []
      responses:
        '200':
          description: The cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404': { $ref: '#/components/responses/NotFound' }
  /carts/{cartId}/items:
    parameters:
      - $ref: '#/components/parameters/CartId'
    post:
      operationId: addCartItem
      summary: Add a product to the cart
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string }
      responses:
        '201':
          description: Item added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /carts/{cartId}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/CartId'
      - name: itemId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: removeCartItem
      summary: Remove an item from the cart
      security: []
      responses:
        '204': { description: Item removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders:
    get:
      operationId: listOrders
      summary: List orders (Store Admin sees all; a signed-in Shopper sees only their own)
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Matching orders
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createOrder
      summary: Check out a cart (guest or signed-in) — charges the card and places the order
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: A product in the cart is no longer available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getOrder
      summary: Get an order's detail (owner or Store Admin only)
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateOrderStatus
      summary: Update an order's fulfillment status (Store Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [placed, packed, shipped, delivered] }
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string }
    CartId:
      name: cartId
      in: path
      required: true
      schema: { type: string }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Caller lacks permission for this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    Product:
      type: object
      required: [id, title, price, status]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        price: { type: number }
        status: { type: string, enum: [available, sold] }
        photoUrls: { type: array, items: { type: string } }
    ProductInput:
      type: object
      required: [title, price]
      properties:
        title: { type: string }
        description: { type: string }
        category: { type: string }
        price: { type: number }
        photoUrls: { type: array, items: { type: string } }
    CartItem:
      type: object
      required: [id, productId]
      properties:
        id: { type: string }
        productId: { type: string }
    Cart:
      type: object
      required: [id, items, total]
      properties:
        id: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        total: { type: number }
    OrderItem:
      type: object
      required: [productId, priceAtPurchase]
      properties:
        productId: { type: string }
        priceAtPurchase: { type: number }
    OrderInput:
      type: object
      required: [cartId, shippingName, shippingAddress, paymentToken]
      properties:
        cartId: { type: string }
        shippingName: { type: string }
        shippingAddress: { type: string }
        email: { type: string, description: required for guest checkout to send confirmation }
        paymentToken: { type: string, description: token from the payment provider's hosted card element }
    Order:
      type: object
      required: [id, status, total, items, createdAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [placed, packed, shipped, delivered] }
        total: { type: number }
        shippingName: { type: string }
        shippingAddress: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        createdAt: { type: string, format: date-time }
